<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="css/style.css">
    <title>Task-manager</title>
</head>
<body>
    <main>
        <h1> Task manager </h1>

        </section>
    </main>
    
    <script src ="js/script.js"></script>
</body>
</html>
